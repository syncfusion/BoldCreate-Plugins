name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated files are up to date
        run: npm run build -- --check
      - name: Manifests, components and context budgets
        run: npm run validate
      - name: Claude Code plugin validator
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.310
          claude plugin validate --strict .
          for dir in */.claude-plugin; do
            claude plugin validate --strict "$(dirname "$dir")"
          done
